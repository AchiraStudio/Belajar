[package]
name = "belajar-storage"
description = "Persistence for Belajar: PostgreSQL (Supabase) via sqlx, with row-level security per owner."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Test helpers (fresh isolated database per test). Enabled by this crate's own tests and by
# downstream crates' dev-dependencies. Needs TEST_DATABASE_ADMIN_URL (see crates/belajar-devdb).
testing = []

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
belajar-storage = { path = ".", features = ["testing"] }
tokio.workspace = true
