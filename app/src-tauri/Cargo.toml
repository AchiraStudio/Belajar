[package]
name = "stuby-app"
description = "Stuby Tauri 2 shell. On desktop it embeds the Stuby server, so the app is standalone."
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

# Not part of the root Cargo workspace on purpose (MIGRATION_PLAN X-6): it needs a built frontend
# and has its own lockfile. CI builds it in a dedicated job.

# The library target is required for the mobile (Android/iOS) entry point.
[lib]
name = "stuby_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# Pinned to the stable 2.x line: crates.io's newest tauri is a 3.0 alpha (docs/TECHNICAL_RISKS R-H2).
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# The server runs inside the app on every platform (desktop and Android): see src/embedded.rs.
stuby-server = { path = "../../crates/stuby-server" }
tokio = { version = "1", features = ["sync", "time"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

# Shipping builds (desktop installer and Android APK): small and fast. Panics stay unwinding on
# purpose so a bug in one request cannot take the whole app down.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 4
strip = true
